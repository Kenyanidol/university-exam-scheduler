<form method="POST">
    <!-- New Password Field -->
    <div style="position: relative; margin-bottom: 1.2rem;">
        <label style="display: block; margin-bottom: 0.5rem; color: #d1d5db;">New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="At least 6 characters" 
               style="width: 100%; padding: 10px 40px 10px 12px; background-color: #1f2937; border: 1px solid #374151; border-radius: 6px; color: white;" required>
        <button type="button" onclick="togglePassword('new_password', 'eye-1')" 
                style="position: absolute; right: 12px; top: 38px; background: none; border: none; cursor: pointer; color: #9ca3af;">
            <svg id="eye-1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>

    <!-- Confirm New Password Field -->
    <div style="position: relative; margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 0.5rem; color: #d1d5db;">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" 
               style="width: 100%; padding: 10px 40px 10px 12px; background-color: #1f2937; border: 1px solid #374151; border-radius: 6px; color: white;" required>
        <button type="button" onclick="togglePassword('confirm_password', 'eye-2')" 
                style="position: absolute; right: 12px; top: 38px; background: none; border: none; cursor: pointer; color: #9ca3af;">
            <svg id="eye-2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </div>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #d97706; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
        Update Password & Proceed
    </button>

<button type="submit" name="skip" value="true" formnovalidate 
        style="width: 100%; padding: 10px; background-color: transparent; color: #9ca3af; border: 1px solid #4b5563; border-radius: 6px; cursor: pointer; margin-top: 10px;">
    Skip for Now (Keep Default)
</button>
</form>

<script>
function togglePassword(fieldId, iconId) {
    const input = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    
    if (input.type === "password") {
        input.type = "text";
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        input.type = "password";
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
}
</script>

</body>
</html>
