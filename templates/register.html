<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - University Exam Portal</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #111827; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background-color: #1f2937; 
            padding: 2rem; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            margin-bottom: 15px; 
            background-color: #374151; 
            border: 1px solid #4b5563; 
            border-radius: 4px; 
            color: white; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background-color: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { 
            background-color: #4338ca; 
        }
        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 1rem; 
            color: #9ca3af; 
            text-decoration: none; 
        }
        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
        <form method="POST">
            <label>Role</label>
            <select name="role">
                <option value="student">Student</option>
                <option value="lecturer">Lecturer</option>
            </select>

            <label>Full Name</label>
            <input type="text" name="name" placeholder="e.g. Jane Doe" required>

            <label>Admission Number / Identifier</label>
            <input type="text" name="identifier" placeholder="e.g. DCF-01-0334/2025" required>

            <button type="submit">Register Account</button>
        </form>
        <a href="{{ url_for('login') }}" class="back-link">Already have an account? Sign In</a>
    </div>
</body>
</html>
