<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - University Exam Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">Security Update Required</h1>
            <p class="text-sm text-slate-400 mt-1">First-time login detected for <span class="font-mono text-slate-200">{{ admission_no }}</span>. Please change your initial password.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm bg-red-900/50 border border-red-700 text-red-200">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">New Password</label>
                <input type="password" name="new_password" required placeholder="At least 6 characters" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-slate-100">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter new password" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-slate-100">
            </div>
            <button type="submit" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 transition font-medium rounded-lg shadow-md text-slate-950 font-semibold">
                Update Password & Proceed
            </button>
        </form>
    </div>
</body>
</html>
